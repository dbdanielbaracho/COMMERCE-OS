name: UI Gates

on:
  push:
    paths:
      - 'prototype/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/ui-gates.yml'
  pull_request:
    paths:
      - 'prototype/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/ui-gates.yml'

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Upload functional render and Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-gate-results
          path: test-results/
          if-no-files-found: ignore
